apiVersion: v1
kind: Namespace
metadata:
  name: nginx-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld
  namespace: nginx-cluster
spec:
  replicas: 3
  selector:
    matchLabels:
      app: helloworld
  template:
    metadata:
      labels:
        app: helloworld
    spec:
      containers:
        - name: helloworld
          image: helloworld-js:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-wrld-service
  namespace: nginx-cluster
spec:
  clusterIP: None
  selector:
    app: helloworld
  ports:
    - port: 3000
      targetPort: 3000
