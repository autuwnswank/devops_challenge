name: YAML Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

rules:
  line-length:
    max: 120
    level: warning

jobs:
  yamllint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .
