- name: Deploy index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    owner: root
    group: root
    mode: "0644"
- name: Apply default.conf
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - nginx
    - install
- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false          # команда ничего не меняет, всегда ок"
  register: nginx_check
  failed_when: nginx_check.rc != 0
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when: nginx_check.rc == 0
- name: Create user with a password
  ansible.builtin.user:
    name: "{{nginx_user}}"
    password: "{{ nginx_pass }}"
    state: present
    shell: /bin/bash
    create_home: yes
